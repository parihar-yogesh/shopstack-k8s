apiVersion: v1
kind: Service
metadata:
  name: products
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: products
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      name: http
  selector:
    {{- include "shopstack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: products