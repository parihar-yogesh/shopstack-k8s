apiVersion: v1
kind: Service
metadata:
  name: orders
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: orders
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: http
      name: http
  selector:
    {{- include "shopstack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orders