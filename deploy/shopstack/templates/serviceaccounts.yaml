# None of these workloads call the Kubernetes API, so no token is mounted into
# them. On EKS these are also the objects an IAM role binds to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: products
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: products
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: orders
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
automountServiceAccountToken: false