apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    {{- include "shopstack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres