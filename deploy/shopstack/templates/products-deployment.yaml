apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: products
spec:
  replicas: {{ .Values.products.replicas }}
  selector:
    matchLabels:
      {{- include "shopstack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: products
  template:
    metadata:
      labels:
        {{- include "shopstack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: products
    spec:
      initContainers:
        - name: migrate
          image: {{ .Values.products.image }}
          command:
            - sh
            - -c
            - node node_modules/node-pg-migrate/bin/node-pg-migrate.js -t pgmigrations_products --advisory-lock-mode wait up && node dist/seed.js
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
      containers:
        - name: products
          image: {{ .Values.products.image }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: {{ .Values.products.logLevel }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.products.resources | nindent 12 }}