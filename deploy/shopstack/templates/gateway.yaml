apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shopstack
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same