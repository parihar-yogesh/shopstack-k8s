secretName: shopstack-secrets

gateway:
  className: nginx
  hostname: shopstack.test

postgres:
  image: postgres:18.6-alpine
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

products:
  image: shopstack/products:dev
  replicas: 1
  logLevel: info
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

orders:
  image: shopstack/orders:dev
  replicas: 1
  logLevel: info
  cookieSecure: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

web:
  image: shopstack/web:dev
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi