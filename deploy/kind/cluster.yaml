kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shopstack
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0
    extraPortMappings:
      # These must match the nodePorts given to NGINX Gateway Fabric at install
      # time. NGF runs as a NodePort service, so the node never listens on
      # 80 and 443 itself.
      - containerPort: 31437
        hostPort: 80
        protocol: TCP
      - containerPort: 30478
        hostPort: 443
        protocol: TCP