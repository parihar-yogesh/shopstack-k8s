apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-api-admin
  namespace: default
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-api-admin
  namespace: default
subjects:
  - kind: Group
    # Must match kubernetes_groups on the access entry in infra/eks.tf.
    name: shopstack-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: gateway-api-admin
  apiGroup: rbac.authorization.k8s.io