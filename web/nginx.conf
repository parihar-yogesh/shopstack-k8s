server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The /api prefix exists so the browser sees one origin. The services
    # themselves serve /products and /orders at the root, so it is stripped here.
    location /api/products {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://products:3000;
    }

    location /api/orders {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://orders:3001;
    }

    location /api/auth {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://orders:3001;
    }

    # Vite fingerprints every asset filename, so a cached copy can never go stale.
    location /assets/ {
        expires 1y;
    }

    # Caching index.html would pin visitors to an old bundle.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}