name: ci

on:
  push:
    branches: [main]
  pull_request:

# Without this, the automatic token gets write access to the whole repository.
# Nothing here writes anything back, so it only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [products, orders]
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: shopstack
          POSTGRES_PASSWORD: shopstack
          POSTGRES_DB: shopstack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://shopstack:shopstack@localhost:5432/shopstack_test
      JWT_SECRET: not-a-real-secret-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
        working-directory: services/${{ matrix.service }}
      - run: npm run typecheck
        working-directory: services/${{ matrix.service }}
      - run: npm test
        working-directory: services/${{ matrix.service }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm version
      - run: helm lint deploy/shopstack
      # Local runs always pass values-kind.yaml, so without the first render the
      # production path is never exercised by anything.
      - run: helm template shopstack deploy/shopstack
      - run: helm template shopstack deploy/shopstack -f deploy/shopstack/values-kind.yaml

  scan:
    name: scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: products
            context: services/products
          - image: orders
            context: services/orders
          - image: web
            context: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t shopstack/${{ matrix.image }}:ci ${{ matrix.context }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shopstack/${{ matrix.image }}:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1